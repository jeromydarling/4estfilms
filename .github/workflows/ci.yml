name: CI

on:
  pull_request:
    paths: ['site/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/**']

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # astro check runs the TS + template typechecker over .astro files.
      - name: Typecheck
        run: npx astro check --minimumSeverity error

      - name: Build
        run: npm run build

      # A green build that emitted nothing is not a green build.
      - name: Verify build output
        run: |
          set -euo pipefail
          for f in dist/client/index.html \
                   dist/client/films/his-name-is-michael/index.html \
                   dist/client/films/strung/index.html \
                   dist/client/about/index.html; do
            [ -s "$f" ] || { echo "::error::missing or empty $f"; exit 1; }
          done
          grep -q 'notify-email' dist/client/index.html \
            || { echo "::error::signup form missing from home page"; exit 1; }
          echo "output OK — $(find dist/client -name '*.html' | wc -l) pages"
