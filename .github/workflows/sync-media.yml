name: Sync media to R2

# The trailer and the Instagram video archive are too heavy for the Worker
# bundle (25 MB per file), so they live in R2 and are served through
# /media/[...key]. Objects are keyed by their path under assets/:
#   assets/video/hnim-trailer-1080.mp4  ->  video/hnim-trailer-1080.mp4
#   assets/instagram/hnimfilm/x.mp4     ->  instagram/hnimfilm/x.mp4
#
# Runs when media changes on main, or on demand. Uploads are skipped for
# objects already present at the same size, so re-running is cheap.

on:
  push:
    branches: [main]
    paths: ['assets/instagram/**', 'assets/video/**']
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-upload every object even if it already exists'
        type: boolean
        default: false

concurrency:
  group: sync-media
  cancel-in-progress: false

jobs:
  sync:
    name: Upload video to R2
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g wrangler@4

      - name: Upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail
          BUCKET=4estfilms-media
          uploaded=0; skipped=0; failed=0

          while IFS= read -r -d '' f; do
            key="${f#assets/}"
            size=$(stat -c%s "$f")

            if [ "${FORCE:-false}" != "true" ]; then
              # `r2 object get --help`-free existence probe: head the object
              # and compare size. Any failure just means "upload it".
              remote=$(wrangler r2 object get "$BUCKET/$key" --remote --pipe 2>/dev/null | wc -c || echo 0)
              if [ "$remote" = "$size" ]; then
                skipped=$((skipped+1)); continue
              fi
            fi

            if wrangler r2 object put "$BUCKET/$key" --file "$f" --remote >/dev/null 2>&1; then
              uploaded=$((uploaded+1))
              echo "  ↑ $key"
            else
              failed=$((failed+1))
              echo "::warning::failed to upload $key"
            fi
          done < <(find assets/instagram assets/video \( -name '*.mp4' -o -name '*.mov' \) -print0)

          {
            echo "### R2 media sync"
            echo
            echo "| | count |"
            echo "|---|---|"
            echo "| uploaded | $uploaded |"
            echo "| skipped (already current) | $skipped |"
            echo "| failed | $failed |"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$failed" -eq 0 ] || { echo "::error::$failed object(s) failed to upload"; exit 1; }
