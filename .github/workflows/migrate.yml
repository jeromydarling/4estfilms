name: Migrate D1

# Schema changes are rare and deliberate, so they are not coupled to the
# deploy. Running them here means a routine site deploy cannot be blocked by
# a database operation, and the deploy token does not need D1 write access.
#
# `wrangler d1 execute --file` uses Cloudflare's D1 *import* API, which
# requires the token to carry **D1: Edit**. A token without it fails with
# "Authentication error [code: 10000]" even when the user behind it is an
# account super admin — the error is about token scope, not account role.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which database to migrate'
        type: choice
        options: [remote, local]
        default: remote

concurrency:
  group: migrate-d1
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # Every statement is CREATE ... IF NOT EXISTS, so re-running is safe.
      - name: Apply 0001 — subscribers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: >-
            d1 execute 4estfilms-db --${{ inputs.target }}
            --file migrations/0001_subscribers.sql

      # SQLite has no ADD COLUMN IF NOT EXISTS, so a re-run of an already
      # applied migration fails with "duplicate column name". That is the
      # expected no-op here, not a failure worth stopping the job for — the
      # schema check below is what actually proves the column landed.
      - name: Apply 0002 — first_name
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: >-
            d1 execute 4estfilms-db --${{ inputs.target }}
            --file migrations/0002_first_name.sql

      - name: Apply 0003 — attribution and events
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: >-
            d1 execute 4estfilms-db --${{ inputs.target }}
            --file migrations/0003_attribution.sql

      - name: Apply 0004 — email tokens and sends
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: >-
            d1 execute 4estfilms-db --${{ inputs.target }}
            --file migrations/0004_email.sql

      - name: Apply 0005 — premiere orders and tickets
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: >-
            d1 execute 4estfilms-db --${{ inputs.target }}
            --file migrations/0005_premiere.sql

      - name: Apply 0006 — community screenings
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: >-
            d1 execute 4estfilms-db --${{ inputs.target }}
            --file migrations/0006_screenings.sql

      - name: Apply 0007 — seed Midwest cities
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: >-
            d1 execute 4estfilms-db --${{ inputs.target }}
            --file migrations/0007_seed_midwest.sql

      - name: Confirm schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: >-
            d1 execute 4estfilms-db --${{ inputs.target }}
            --command "SELECT name FROM pragma_table_info('subscribers')"
